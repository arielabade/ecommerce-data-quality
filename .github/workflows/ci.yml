name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff==0.17.1
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - name: regras, carga, contratos, catálogo, bloqueio do gabarito, reprodutibilidade do injetor
        run: pytest -q -m "not e2e"

  e2e:
    # Pipeline inteiro no perfil pequeno (amostra versionada em data/sample, sem MySQL):
    # extrair -> corromper -> ETL em incrementos -> reexecutar -> avaliar -> relatório.
    runs-on: ubuntu-latest
    needs: test
    env:
      DQ_PROFILE: small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q -m e2e
      - name: make small (mesmos alvos do Makefile)
        run: make small PY=python
